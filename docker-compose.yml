services:
  secret-nils:
    build:
      context: .
      dockerfile: Dockerfile
    image: secret-nils:latest
    ports:
      - "1488:1488"
    environment:
      PORT: "1488"
      HOST: "0.0.0.0"
      POLICIES_PATH: /app/data/policies.json
    volumes:
      - secret-nils-data:/app/data
    restart: unless-stopped

volumes:
  secret-nils-data:
